<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  max-width:100vw;
  overflow-x:hidden;
  background:#e8ecf2;
  font-family:'Noto Sans Malayalam',sans-serif;
  color:#1a1c22;
  -webkit-text-size-adjust:100%;
}
.wrap{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:6px 4px 20px;
}

/* Search Area */
.search-area{
  background:#fff;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:8px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
}
.search-area label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
  color:#334155;
}
.search-row{display:flex;gap:6px}
.search-row input{
  flex:1;
  min-width:0;
  padding:8px 10px;
  border:2px solid #cbd5e1;
  border-radius:6px;
  font-size:16px;
  font-weight:800;
  font-family:inherit;
  letter-spacing:1px;
  outline:none;
  background:#f8fafc;
  color:#0f172a;
}
.search-row input:focus{border-color:#0d9488}
.search-row button{
  padding:8px 12px;
  background:#0d9488;
  color:#fff;
  border:0;
  border-radius:6px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
}
.search-row button:disabled{opacity:.6}

.search-msg{font-size:11.5px;font-weight:600;margin-top:4px;min-height:15px}
.search-msg.ok{color:#16a34a}
.search-msg.err{color:#dc2626}

/* Action Bar: WhatsApp, Print */
.action-bar{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}
.action-bar button{
  flex:1;
  padding:8px 8px;
  border:0;
  border-radius:6px;
  font-family:inherit;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.btn-wa{background:#25d366;color:#0b3b19}
.btn-wa:hover{background:#20bd5a}
.btn-print{background:#c8201a;color:#fff}
.btn-print:hover{background:#a61a15}

/* ===== THE BOARD - 100% width, zero overflow on mobile ===== */
.board-scroll{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  margin-bottom:8px;
}

#board{
  width:100%;
  max-width:100%;
  background:#fff;
  border:2px solid #1a5e1a;
  border-radius:4px;
  color:#000;
  overflow:hidden;
}

/* Board Header */
.b-head{
  background:#2e7d32;
  color:#fff;
  padding:5px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.b-head .title{font-size:15.5px;font-weight:900}
.b-head .title small{font-size:11px;font-weight:700}
.b-head .head-right{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:1px;
}
.b-head .date{font-size:12.5px;font-weight:800}
.b-head .time{font-size:10px;font-weight:700;opacity:0.92}

/* Board Meta Info */
.b-meta{
  background:#f4f9f4;
  padding:5px 8px;
  font-size:11.5px;
  color:#1b5e20;
  border-bottom:1.5px solid #1a5e1a;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.b-meta .meta-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:6px;
  min-width:0;
}
.b-meta b{color:#0d531a;font-weight:800}
.meta-col{
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.meta-col.text-right{
  text-align:right;
}
.loc-badge{
  font-size:11px;
  font-weight:800;
  color:#14532d;
  background:#dcfce7;
  padding:1px 6px;
  border-radius:4px;
  border:1px solid #86efac;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:72%;
}
.dealer-tag{
  color:#0f5132;
  font-weight:800;
  cursor:pointer;
  border-bottom:1px dashed #2e7d32;
  padding:0 2px;
}

/* Board Table */
#board table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
#board th,#board td{
  border:1.5px solid #1a5e1a;
  padding:4px 1px;
  text-align:center;
  vertical-align:middle;
  overflow:hidden;
}

/* Column headers */
#board th{
  font-size:11px;
  font-weight:900;
  color:#000;
  line-height:1.15;
  word-wrap:break-word;
  hyphens:auto;
}
#board th.h-item{background:#cfe6f7;width:22%}
#board th.h-aay{background:#fbf0a8;width:19.5%}
#board th.h-phh{background:#dcd6f2;width:19.5%}
#board th.h-nps{background:#d4ecc8;width:19.5%}
#board th.h-npns{background:#f6cfd6;width:19.5%}

/* Data cells */
#board td.c-item{
  text-align:left;
  padding-left:4px;
  font-weight:900;
  font-size:12.5px;
  background:#fffde7;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#board td.c-val{
  font-weight:800;
  font-size:14px;
  color:#1a237e;
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
#board td.c-empty{
  color:#bbb;
  font-weight:400;
  background:#fff;
  font-size:12px;
}

/* Special row */
#board tr.row-special td{
  background:#fffde7;
  font-weight:800;
  font-size:12px;
  height:32px;
  text-align:left;
  padding-left:4px;
}

/* Board Footer */
.b-foot{
  background:#f4f9f4;
  padding:3px 6px;
  font-size:10px;
  font-weight:700;
  color:#2e7d32;
  text-align:right;
  border-top:1.5px solid #1a5e1a;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Larger screens */
@media (min-width: 600px){
  .wrap{padding:14px 10px 30px}
  .b-head .title{font-size:20px}
  .b-head .date{font-size:15px}
  .b-head .time{font-size:12px}
  .b-meta{font-size:13px;padding:7px 10px;gap:5px}
  .loc-badge{font-size:12px;padding:2px 8px}
  #board th{font-size:14px;padding:6px 3px}
  #board td.c-item{font-size:15px;padding-left:6px}
  #board td.c-val{font-size:17px}
  #board tr.row-special td{font-size:14px;height:42px}
  .action-bar{max-width:400px;margin-left:auto}
  .action-bar button{font-size:13px;padding:8px 12px}
}

/* Print */
@media print{
  body{background:#fff!important}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  #board{width:100%;border:3px solid #000}
  #board th,#board td{border-color:#000}
  #board table{font-size:20px}
  #board th{font-size:16px}
  #board td.c-val{font-size:22px;color:#000}
  .b-head{background:#2e7d32;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .b-head .title{font-size:26px}
  .b-head .date{font-size:20px}
  .b-head .time{display:none}
  .b-meta{background:#fff!important;border-bottom-color:#000!important}
  .dealer-tag{border-bottom:none!important}
  .loc-badge{border-color:#000!important;background:#fff!important;color:#000!important}
  #board th.h-item,#board th.h-aay,#board th.h-phh,#board th.h-nps,#board th.h-npns{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  #board td.c-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
}
</style>

function getDistrictAndTso(ard, apiDist, apiTso){
  if(!ard || ard.length < 2) return {dist:"", tso:"", full:"—"};
  var dCode = ard.slice(0, 2);
  var tCode = ard.length >= 4 ? ard.slice(2, 4) : "";
  var dtCode = ard.length >= 4 ? ard.slice(0, 4) : "";

  var distName = apiDist || DISTRICT_MAP[dCode] || dCode;
  var tsoName = apiTso || TSO_MAP[dtCode] || tCode;

  var full = "District: " + distName;
  if(tsoName) full += " / TSO: " + tsoName;
  return {dist:distName, tso:tsoName, full:full};
}

/* ---- Commodity mapping & consolidation ---- */
var MAL = {
 "Raw rice":"പച്ചരി","Fort.RR":"പച്ചരി","PMGKAY RR":"പച്ചരി","Raw rice SPL":"പച്ചരി","Free RR":"പച്ചരി","Special RR":"പച്ചരി",
 "Boiled rice":"പുഴുക്കലരി","Fort.BR":"പുഴുക്കലരി","BR F. SPL":"പുഴുക്കലരി","Special BR":"പുഴുക്കലരി",
 "Boiled rice SPL":"പുഴുക്കലരി","Fort.CMR":"പുഴുക്കലരി","CMR":"പുഴുക്കലരി",
 "Matta rice":"മട്ട അരി","Matta rice SPL":"മട്ട അരി",
 "Wheat":"ഗോതമ്പ്","PMGKAY Wheat":"ഗോതമ്പ്",
 "Atta":"ആട്ട","Fort.Atta":"ആട്ട",
 "Sugar":"പഞ്ചസാര","Koil":"മണ്ണെണ്ണ",
 "RAGI":"റാഗി","Ragi":"റാഗി","RAGI POWDER":"റാഗി പൊടി","Ragi Powder":"റാഗി പൊടി",
 "Spl. Festival Kit":"കിറ്റ്","Festival Kit":"കിറ്റ്","FreeKit":"കിറ്റ്","Free Kit":"കിറ്റ്"
};

function getRowKey(item){
 if(MAL[item]) return MAL[item];
 if(/matta/i.test(item)) return "മട്ട അരി";
 if(/fort\.?rr|raw\s*rice|free\s*rr|special\s*rr|pmgkay\s*rr/i.test(item)) return "പച്ചരി";
 if(/fort\.?br|boiled\s*rice|special\s*br|cmr|br\s*f\./i.test(item)) return "പുഴുക്കലരി";
 if(/wheat/i.test(item)) return "ഗോതമ്പ്";
 if(/atta/i.test(item)) return "ആട്ട";
 if(/sugar/i.test(item)) return "പഞ്ചസാര";
 if(/koil|kerosene/i.test(item)) return "മണ്ണെണ്ണ";
 if(/ragi/i.test(item)) return (/powder/i.test(item) ? "റാഗി പൊടി" : "റാഗി");
 if(/kit/i.test(item)) return "കിറ്റ്";
 return item;
}

/* Standard board rows (exact order as physical board) */
var ROWS = ["പുഴുക്കലരി", "പച്ചരി", "മട്ട അരി", "ഗോതമ്പ്", "ആട്ട", "മണ്ണെണ്ണ", "പഞ്ചസാര"];

/* ---- Parser: handles Tab-separated AND Space-separated AND comma-formatted numbers ---- */
function parseText(text){
 if(!text) return {header:null, entries:[]};
 var lines = text.split(/\r?\n/);
 var header = null;
 var entries = [];

 for(var i = 0; i < lines.length; i++){
  var line = lines[i].trim();
  if(!line) continue;

  /* Header */
  if(!header){
   var hm = line.match(/Stock Register for FPS (\d+)(?:\s*[-–]\s*([A-Za-z\s.]+?))?\s*(?:\(District:\s*([^/]+)\/\s*TSO:\s*([^)]+)\))?\s*(?:for\s*(.+))?/i);
   if(hm){
    var rawDealer = hm[2] ? hm[2].trim() : "";
    if(/district|tso|month|year|fps|stock|select/i.test(rawDealer)) rawDealer = "";
    header = {
      ard: hm[1],
      dealer: rawDealer,
      dist: (hm[3] || "").trim(),
      tso: (hm[4] || "").trim(),
      period: (hm[5] || "").trim()
    };
    continue;
   }
  }

  /* Tab-separated */
  if(line.indexOf("\t") >= 0){
   var p = line.split("\t").map(function(s){return s.trim();}).filter(Boolean);
   if(p.length >= 5){
    var si = /^\d+$/.test(p[0]) ? 1 : 0;
    var sch = (p[si] || "").toUpperCase();
    var itm = p[si+1] || "";
    var un = p[si+2] || "";
    var lastN = null;
    for(var j = p.length - 1; j >= si + 3; j--){
     var v = parseFloat(p[j].replace(/,/g, ""));
     if(!isNaN(v)){lastN = v; break;}
    }
    if(lastN !== null && itm && un){
     entries.push({scheme:sch, item:itm, rawUnit:un, cb:lastN});
     continue;
    }
   }
  }

  /* Space-separated */
  var cl = line.replace(/,/g, "");
  var sm = cl.match(/(?:^|\s)(AAY|NPI|NPNS|NPS|PHH|ALL|FREE|PL)\s+(.+?)\s+(Kgs|Ltrs|Pkts|FreeKit|Free Kit)\s+((?:-?\d+(?:\.\d+)?\s*)+)$/i);
  if(sm){
   var nums = sm[4].trim().split(/\s+/).map(Number).filter(function(n){return !isNaN(n);});
   entries.push({scheme:sm[1].toUpperCase(), item:sm[2].trim(), rawUnit:sm[3], cb:nums.length ? nums[nums.length-1] : 0});
  }
 }

 /* Fallback global header search */
 if(!header){
  var hg = text.replace(/\s+/g, " ").match(/Stock Register for FPS (\d+)(?:\s*[-–]\s*([A-Za-z\s.]+?))?\s*(?:\(District:\s*([^/]+)\/\s*TSO:\s*([^)]+)\))?\s*(?:for\s*(.+?)(?:\s|$))?/i);
  if(hg){
    var rawD = hg[2] ? hg[2].trim() : "";
    if(/district|tso|month|year|fps|stock|select/i.test(rawD)) rawD = "";
    header = {
      ard: hg[1],
      dealer: rawD,
      dist: (hg[3] || "").trim(),
      tso: (hg[4] || "").trim(),
      period: (hg[5] || "").trim()
    };
  }
 }
 return {header:header, entries:entries};
}

/* Dealer names saved locally per ARD - clean corrupted legacy strings */
var DEALERS = {};
try {
  DEALERS = JSON.parse(localStorage.getItem("rsb_dealers") || "{}");
  Object.keys(DEALERS).forEach(function(k) {
    if (!DEALERS[k] || /district|tso|month|year|—/i.test(DEALERS[k])) {
      delete DEALERS[k];
    }
  });
  localStorage.setItem("rsb_dealers", JSON.stringify(DEALERS));
} catch(e) {}

function editDealerName(){
 var ardVal = document.getElementById("bArd").textContent.replace(/\D/g, "") || CFG.ard;
 if(!ardVal) return;
 var cur = DEALERS[ardVal] || document.getElementById("bDealer").textContent;
 if(cur === "—") cur = "";
 var neu = prompt("ലൈസൻസിയുടെ പേര് നൽകുക:", cur);
 if(neu !== null){
  DEALERS[ardVal] = neu.trim();
  try{localStorage.setItem("rsb_dealers", JSON.stringify(DEALERS));}catch(e){}
  document.getElementById("bDealer").textContent = neu.trim() || "—";
 }
}

/* ---- Render Board ---- */
function renderBoard(text, dealerFromApi, apiDist, apiTso, explicitArd, fetchTime){
 var res = parseText(text);
 var entries = res.entries;

 /* Aggregate by board row */
 var data = {};
 ROWS.forEach(function(r){data[r] = {aay:0, phh:0, nps:0, npns:0, all:0, has:false};});
 var extraRows = [];

 entries.forEach(function(e){
  var key = getRowKey(e.item);
  if(!data[key]){
   data[key] = {aay:0, phh:0, nps:0, npns:0, all:0, has:false};
   extraRows.push(key);
  }
  var d = data[key];
  d.has = true;
  if(e.scheme === "AAY") d.aay += e.cb;
  else if(e.scheme === "PHH") d.phh += e.cb;
  else if(e.scheme === "NPS") d.nps += e.cb;
  else if(e.scheme === "NPNS") d.npns += e.cb;
  else d.all += e.cb;
 });

 /* Cross-scheme offset netting (e.g. AePDS balance transfer where AAY = -43 and ALL = +43 -> net 0) */
 Object.keys(data).forEach(function(key){
  var d = data[key];
  if(d.all > 0){
   ["aay", "phh", "nps", "npns"].forEach(function(sch){
    if(d[sch] < 0){
     var offset = Math.min(-d[sch], d.all);
     d[sch] += offset;
     d.all -= offset;
    }
   });
  } else if(d.all < 0){
   ["aay", "phh", "nps", "npns"].forEach(function(sch){
    if(d[sch] > 0){
     var offset = Math.min(d[sch], -d.all);
     d[sch] -= offset;
     d.all += offset;
    }
   });
  }
 });

 /* Date and Time */
 var now = fetchTime ? new Date(fetchTime) : new Date();
 var pad = function(n){return n < 10 ? "0" + n : n;};
 var hours = now.getHours();
 var ampm = hours >= 12 ? "PM" : "AM";
 hours = hours % 12;
 hours = hours ? hours : 12;
 var timeStr = pad(hours) + ":" + pad(now.getMinutes()) + " " + ampm;
 var dateStr = pad(now.getDate()) + "/" + pad(now.getMonth()+1) + "/" + now.getFullYear();

 document.getElementById("bDate").textContent = dateStr;
 document.getElementById("bTime").textContent = "🕒 " + timeStr;

 /* Meta bar & Dealer info */
 var meta = document.getElementById("bMeta");
 var currentArd = explicitArd || (res.header && res.header.ard) || CFG.ard || "";

 if(currentArd){
  meta.style.display = "flex";
  document.getElementById("bArd").textContent = currentArd;

  // Resolve dealer name: custom saved > API fetched > header
  var dName = "";
  if(dealerFromApi && !/district|tso|month|year/i.test(dealerFromApi)){
    dName = dealerFromApi;
    DEALERS[currentArd] = dName;
    try{localStorage.setItem("rsb_dealers", JSON.stringify(DEALERS));}catch(e){}
  } else {
    dName = DEALERS[currentArd] || (res.header && res.header.dealer) || "";
    if(/district|tso|month|year/i.test(dName)) dName = "";
  }
  document.getElementById("bDealer").textContent = dName || "—";

  // Resolve District and TSO
  var loc = getDistrictAndTso(
    currentArd,
    apiDist || (res.header && res.header.dist),
    apiTso || (res.header && res.header.tso)
  );
  document.getElementById("bDistTso").textContent = loc.full;

  var periodVal = (res.header && res.header.period) || "";
  if(!periodVal){
    var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    periodVal = months[now.getMonth()] + " " + now.getFullYear();
  }
  document.getElementById("bPeriod").textContent = periodVal;
  document.getElementById("bFoot").textContent = "ARD " + currentArd + (dName ? " · " + dName : "") + " · " + loc.full + " · " + dateStr + " " + timeStr;
 } else {
  meta.style.display = "none";
  document.getElementById("bFoot").textContent = "";
 }

 /* Build table */
 if(!entries.length){
  document.getElementById("bBody").innerHTML =
   '<tr><td colspan="5" style="padding:25px 4px;color:#888;font-weight:700">' +
   'ഡാറ്റ ലഭ്യമല്ല</td></tr>';
  return;
 }

 function fv(n){
  if(Math.abs(n) < 0.05) return "";
  return String(Math.round(n * 10) / 10);
 }

 var html = "";
 var specialKitText = "";
 var allRows = ROWS.concat(extraRows);

 allRows.forEach(function(name){
  var d = data[name];
  if(!d) return;

  var isStandard = ROWS.indexOf(name) >= 0;
  var totalVal = Math.abs(d.aay) + Math.abs(d.phh) + Math.abs(d.nps) + Math.abs(d.npns) + Math.abs(d.all);

  // If item is Kit and has positive stock, capture for special row
  if((name === "കിറ്റ്" || /kit/i.test(name)) && totalVal >= 0.05){
   var kitBal = (d.aay + d.phh + d.nps + d.npns + d.all);
   if(kitBal > 0.05){
    specialKitText = " (കിറ്റ്: " + fv(kitBal) + ")";
   }
   return;
  }

  // For non-standard extra rows, ONLY show if stock is non-zero
  if(!isStandard && totalVal < 0.05) return;

  // For standard rows, if completely unused, skip
  if(!d.has && totalVal < 0.05) return;

  var aay = fv(d.aay);
  var phh = fv(d.phh);
  var nps = fv(d.nps);
  var npns = fv(d.npns);

  /* If only "ALL" scheme has value (e.g. Koil), show in npns column as in physical board */
  if(d.all > 0 && !d.aay && !d.phh && !d.nps && !d.npns){
   npns = fv(d.all);
  }

  html += '<tr>' +
   '<td class="c-item">' + name + '</td>' +
   '<td class="' + (aay ? "c-val" : "c-empty") + '">' + (aay || "") + '</td>' +
   '<td class="' + (phh ? "c-val" : "c-empty") + '">' + (phh || "") + '</td>' +
   '<td class="' + (nps ? "c-val" : "c-empty") + '">' + (nps || "") + '</td>' +
   '<td class="' + (npns ? "c-val" : "c-empty") + '">' + (npns || "") + '</td>' +
   '</tr>';
 });

 /* Special distribution row (physical board 8th row) */
 html += '<tr class="row-special"><td colspan="5">സ്പെഷ്യൽ വിതരണം' + specialKitText + '</td></tr>';

 document.getElementById("bBody").innerHTML = html;
}

/* ---- WhatsApp Sharing ---- */
function shareToWhatsApp(){
  var ardVal = document.getElementById("bArd").textContent || CFG.ard;
  if(!ardVal || ardVal === "—"){
    alert("ആദ്യം ARD നമ്പർ നൽകി സ്റ്റോക്ക് എടുക്കുക");
    return;
  }
  var dealer = document.getElementById("bDealer").textContent;
  var loc = document.getElementById("bDistTso").textContent;
  var dateStr = document.getElementById("bDate").textContent;
  var timeStr = document.getElementById("bTime").textContent.replace(/🕒\s*/, "");

  var text = "📋 *റേഷൻ സ്റ്റോക്ക് നിലവാരം*\n";
  text += "🏪 *ARD:* " + ardVal + (dealer && dealer !== "—" ? " (" + dealer + ")" : "") + "\n";
  text += "📍 *" + loc + "*\n";
  text += "📅 *തീയതി:* " + dateStr + (timeStr ? " " + timeStr : "") + "\n";
  text += "━━━━━━━━━━━━━━━━━━━━\n";

  var rows = document.querySelectorAll("#bBody tr");
  var hasItems = false;
  rows.forEach(function(r){
    var item = r.querySelector(".c-item");
    if(!item) return;
    var itemName = item.textContent.trim();
    var cells = r.querySelectorAll("td");
    if(cells.length < 5) return;
    var aay = cells[1].textContent.trim();
    var phh = cells[2].textContent.trim();
    var nps = cells[3].textContent.trim();
    var npns = cells[4].textContent.trim();

    var parts = [];
    if(aay) parts.push("AAY: " + aay + "kg");
    if(phh) parts.push("PHH: " + phh + "kg");
    if(nps) parts.push("NPS: " + nps + "kg");
    if(npns) parts.push("NPNS: " + npns + "kg");

    if(parts.length){
      hasItems = true;
      text += "🌾 *" + itemName + ":* " + parts.join(" | ") + "\n";
    }
  });

  if(!hasItems){
    text += "സ്റ്റോക്ക് വിവരങ്ങൾ ലഭ്യമല്ല.\n";
  }

  text += "━━━━━━━━━━━━━━━━━━━━\n";
  text += "ℹ️ _AePDS Kerala ഔദ്യോഗിക വിവരങ്ങൾ_";

  if(typeof navigator !== "undefined" && navigator.share){
    navigator.share({
      title: "റേഷൻ സ്റ്റോക്ക് - ARD " + ardVal,
      text: text
    }).catch(function(){
      window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text), "_blank");
    });
  } else {
    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text), "_blank");
  }
}

/* ---- Search ---- */
var CFG = {ard:""};
try{var c = localStorage.getItem("rsb_cfg"); if(c) CFG = JSON.parse(c);}catch(e){}
document.getElementById("ard").value = CFG.ard || "";

function doSearch(isFresh){
 var ardVal = document.getElementById("ard").value.replace(/\D/g, "");
 var msg = document.getElementById("statusMsg");
 var btn = document.querySelector(".search-row button");

 if(ardVal.length !== 7){
  msg.className = "search-msg err";
  msg.textContent = "ശരിയായ 7 അക്ക ARD നമ്പർ നൽകുക";
  return;
 }

 CFG.ard = ardVal;
 try{localStorage.setItem("rsb_cfg", JSON.stringify(CFG));}catch(e){}

 // Instantly update header to new ARD and reset dealer until fetched
 document.getElementById("bMeta").style.display = "flex";
 document.getElementById("bArd").textContent = ardVal;
 document.getElementById("bDealer").textContent = DEALERS[ardVal] || "എടുക്കുന്നു...";
 var locPre = getDistrictAndTso(ardVal);
 document.getElementById("bDistTso").textContent = locPre.full;

 var dist = ardVal.slice(0, 2);
 var tso = ardVal.slice(2, 4);
 var d = new Date();

 if(btn){btn.disabled = true; btn.textContent = "എടുക്കുന്നു...";}
 msg.className = "search-msg";
 msg.textContent = "ePOS പോർട്ടലിൽ നിന്ന് സ്റ്റോക്ക് എടുക്കുന്നു...";

 var url = "/api/stock?dist=" + dist + "&tso=" + tso + "&ard=" + ardVal + "&month=" + (d.getMonth() + 1) + "&year=" + d.getFullYear() + "&_t=" + Date.now();

 fetch(url, { cache: "no-store" })
  .then(function(r){return r.json();})
  .then(function(j){
   if(j.error){
    msg.className = "search-msg err";
    msg.textContent = "പിശക്: " + j.error;
    document.getElementById("bDealer").textContent = DEALERS[ardVal] || "—";
    return;
   }
   var nowIso = new Date().toISOString();
   try{
     localStorage.setItem("rsb_text", j.text);
     localStorage.setItem("rsb_time", nowIso);
   }catch(e){}
   renderBoard(j.text, j.dealerName, j.districtName, j.tsoName, ardVal, nowIso);
   msg.className = "search-msg ok";
   msg.textContent = "സ്റ്റോക്ക് വിജയകരമായി ലഭിച്ചു ✓";
  })
  .catch(function(){
   msg.className = "search-msg err";
   msg.textContent = "എടുക്കാൻ കഴിഞ്ഞില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക.";
   document.getElementById("bDealer").textContent = DEALERS[ardVal] || "—";
  })
  .finally(function(){
   if(btn){btn.disabled = false; btn.textContent = "സ്റ്റോക്ക് എടുക്കുക";}
  });
}

/* Load saved data on start */
try{
 var saved = localStorage.getItem("rsb_text");
 var savedTime = localStorage.getItem("rsb_time");
 if(saved) renderBoard(saved, null, null, null, CFG.ard, savedTime);
}catch(e){}

/* Auto-fetch if ARD is saved */
if(CFG.ard && CFG.ard.length === 7 && location.protocol.indexOf("http") === 0){
 doSearch();
}
</script>
