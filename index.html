<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>റേഷൻ സ്റ്റോക്ക് ബോർഡ്</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#e8ecf2;
  font-family:'Noto Sans Malayalam',sans-serif;
  color:#1a1c22;
  padding:0;
  -webkit-text-size-adjust:100%;
}
.wrap{
  max-width:720px;
  margin:0 auto;
  padding:10px 8px 30px;
}

/* Search Area */
.search-area{
  background:#fff;
  border-radius:10px;
  padding:10px 12px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
}
.search-area label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  color:#334155;
}
.search-row{display:flex;gap:6px}
.search-row input{
  flex:1;
  min-width:0;
  padding:9px 12px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  font-size:18px;
  font-weight:800;
  font-family:inherit;
  letter-spacing:1.5px;
  outline:none;
  background:#f8fafc;
  color:#0f172a;
}
.search-row input:focus{border-color:#0d9488}
.search-row button{
  padding:9px 16px;
  background:#0d9488;
  color:#fff;
  border:0;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  flex-shrink:0;
  transition:background .15s;
}
.search-row button:hover{background:#0f766e}
.search-row button:disabled{opacity:.6;cursor:not-allowed}
.search-msg{font-size:12px;font-weight:600;margin-top:5px;min-height:16px}
.search-msg.ok{color:#16a34a}
.search-msg.err{color:#dc2626}

/* Print Button */
.print-bar{text-align:right;margin-bottom:8px}
.print-bar button{
  padding:8px 16px;
  background:#c8201a;
  color:#fff;
  border:0;
  border-radius:6px;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}
.print-bar button:hover{background:#a71a15}

/* ===== THE BOARD - 100% width, mobile friendly, no horizontal overflow ===== */
.board-scroll{
  width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin-bottom:10px;
}

#board{
  background:#fff;
  border:2.5px solid #1a5e1a;
  border-radius:4px;
  width:100%;
  color:#000;
}

/* Board Header: Green bar */
.b-head{
  background:#2e7d32;
  color:#fff;
  padding:6px 10px;
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex-wrap:wrap;
  gap:2px;
}
.b-head .title{font-size:18px;font-weight:900}
.b-head .title small{font-size:12px;font-weight:700}
.b-head .date{font-size:15px;font-weight:800}

/* Board Meta: shop & dealer info */
.b-meta{
  background:#e8f5e9;
  padding:6px 10px;
  font-size:12px;
  font-weight:700;
  color:#1b5e20;
  border-bottom:2px solid #1a5e1a;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.b-meta .meta-row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
}
.dealer-tag{
  color:#0f5132;
  cursor:pointer;
  border-bottom:1px dashed #2e7d32;
  padding:0 2px;
}

/* Board Table */
#board table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}
#board th,#board td{
  border:1.5px solid #1a5e1a;
  padding:6px 2px;
  text-align:center;
  vertical-align:middle;
  overflow:hidden;
  word-break:break-word;
}

/* Column header row */
#board th{
  font-size:12.5px;
  font-weight:900;
  color:#000;
  line-height:1.2;
}
#board th.h-item{background:#cfe6f7;width:22%}
#board th.h-aay{background:#fbf0a8;width:19.5%}
#board th.h-phh{background:#dcd6f2;width:19.5%}
#board th.h-nps{background:#d4ecc8;width:19.5%}
#board th.h-npns{background:#f6cfd6;width:19.5%}

/* Data cells */
#board td.c-item{
  text-align:left;
  padding-left:5px;
  font-weight:900;
  font-size:14px;
  background:#fffde7;
  line-height:1.2;
}
#board td.c-val{
  font-weight:800;
  font-size:16px;
  color:#1a237e;
  background:#fff;
}
#board td.c-empty{
  color:#bbb;
  font-weight:400;
  background:#fff;
  font-size:14px;
}

/* Special row */
#board tr.row-special td{
  background:#fffde7;
  font-weight:800;
  font-size:13.5px;
  height:40px;
  text-align:left;
  padding-left:5px;
}

/* Board Footer */
.b-foot{
  background:#e8f5e9;
  padding:3px 8px;
  font-size:10.5px;
  font-weight:600;
  color:#2e7d32;
  text-align:right;
  border-top:1.5px solid #1a5e1a;
}

/* Desktop enhancements */
@media (min-width: 600px){
  .wrap{padding:16px 14px 40px}
  .b-head .title{font-size:22px}
  .b-head .date{font-size:18px}
  .b-meta{font-size:13px;padding:8px 12px}
  #board th{font-size:15px;padding:7px 4px}
  #board td.c-item{font-size:16px;padding-left:8px}
  #board td.c-val{font-size:18px}
  #board tr.row-special td{font-size:15px;height:48px;padding-left:8px}
}

/* Print */
@media print{
  body{background:#fff!important}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
  .board-scroll{overflow:visible}
  #board{width:100%;border:3px solid #000}
  #board th,#board td{border-color:#000}
  #board table{font-size:20px}
  #board th{font-size:16px}
  #board td.c-val{font-size:22px;color:#000}
  .b-head{background:#2e7d32;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .b-head .title{font-size:26px}
  .b-head .date{font-size:20px}
  .b-meta{background:#fff!important;border-bottom-color:#000!important}
  .dealer-tag{border-bottom:none!important}
  #board th.h-item,#board th.h-aay,#board th.h-phh,#board th.h-nps,#board th.h-npns{
    -webkit-print-color-adjust:exact;print-color-adjust:exact;
  }
  #board td.c-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
}
</style>
</head>
<body>
<div class="wrap">

<!-- Search -->
<div class="search-area noprint">
 <label for="ard">റേഷൻ കടയുടെ ARD നമ്പർ (7 അക്കം):</label>
 <div class="search-row">
  <input id="ard" inputmode="numeric" maxlength="7" placeholder="ഉദാ: 2367097"
   oninput="this.value=this.value.replace(/\D/g,'')"
   onkeydown="if(event.key==='Enter')doSearch()">
  <button onclick="doSearch()">സ്റ്റോക്ക് എടുക്കുക</button>
 </div>
 <div id="statusMsg" class="search-msg"></div>
</div>

<!-- Print -->
<div class="print-bar noprint">
 <button onclick="window.print()">🖨 ബോർഡ് പ്രിന്റ് ചെയ്യുക</button>
</div>

<!-- Board -->
<div class="board-scroll">
<div id="board">
 <div class="b-head">
  <span class="title">സ്റ്റോക്ക് വിവരം <small>(കി ഗ്രാം)</small></span>
  <span class="date" id="bDate"></span>
 </div>
 <div class="b-meta" id="bMeta" style="display:none">
  <div class="meta-row">
   <span><b>ARD:</b> <span id="bArd">—</span></span>
   <span><b>വ്യാപാരി:</b> <span id="bDealer" class="dealer-tag" onclick="editDealerName()" title="പേര് മാറ്റാൻ ക്ലിക്ക് ചെയ്യുക">—</span></span>
  </div>
  <div class="meta-row">
   <span><b>ഓഫീസ്:</b> <span id="bTso">—</span></span>
   <span id="bPeriodWrap"><b>മാസം:</b> <span id="bPeriod">—</span></span>
  </div>
 </div>
 <table>
  <thead>
   <tr>
    <th class="h-item">ഇനം</th>
    <th class="h-aay">എ.എ.വൈ</th>
    <th class="h-phh">പ്രയോരിറ്റി</th>
    <th class="h-nps">എൻ പി എസ്</th>
    <th class="h-npns">എൻ പി എൻ എസ്</th>
   </tr>
  </thead>
  <tbody id="bBody">
   <tr><td colspan="5" style="padding:25px 8px;color:#888;font-weight:700">
    ARD നമ്പർ നൽകി "സ്റ്റോക്ക് എടുക്കുക" അമർത്തുക
   </td></tr>
  </tbody>
 </table>
 <div class="b-foot" id="bFoot"></div>
</div>
</div>

<p class="noprint" style="font-size:11px;color:#888;text-align:center;margin-top:6px">
 AePDS കേരള പോർട്ടൽ ഡാറ്റ. ബോർഡിൽ എഴുതും മുൻപ് ePOS വിവരങ്ങളുമായി ഒത്തുനോക്കുക.
</p>

</div>

<script>
/* ---- Commodity mapping & consolidation ---- */
var MAL = {
 "Raw rice":"പച്ചരി","Fort.RR":"പച്ചരി","PMGKAY RR":"പച്ചരി","Raw rice SPL":"പച്ചരി","Free RR":"പച്ചരി","Special RR":"പച്ചരി",
 "Boiled rice":"പുഴുക്കലരി","Fort.BR":"പുഴുക്കലരി","BR F. SPL":"പുഴുക്കലരി","Special BR":"പുഴുക്കലരി",
 "Boiled rice SPL":"പുഴുക്കലരി","Fort.CMR":"പുഴുക്കലരി","CMR":"പുഴുക്കലരി",
 "Matta rice":"മട്ട അരി","Matta rice SPL":"മട്ട അരി",
 "Wheat":"ഗോതമ്പ്","PMGKAY Wheat":"ഗോതമ്പ്",
 "Atta":"ആട്ട","Fort.Atta":"ആട്ട",
 "Sugar":"പഞ്ചസാര","Koil":"മണ്ണെണ്ണ",
 "RAGI":"റാഗി","Ragi":"റാഗി","RAGI POWDER":"റാഗി പൊടി","Ragi Powder":"റാഗി പൊടി",
 "Spl. Festival Kit":"കിറ്റ്","Festival Kit":"കിറ്റ്","FreeKit":"കിറ്റ്","Free Kit":"കിറ്റ്"
};

function getRowKey(item){
 if(MAL[item])return MAL[item];
 if(/matta/i.test(item))return "മട്ട അരി";
 if(/fort\.?rr|raw\s*rice|free\s*rr|special\s*rr|pmgkay\s*rr/i.test(item))return "പച്ചരി";
 if(/fort\.?br|boiled\s*rice|special\s*br|cmr|br\s*f\./i.test(item))return "പുഴുക്കലരി";
 if(/wheat/i.test(item))return "ഗോതമ്പ്";
 if(/atta/i.test(item))return "ആട്ട";
 if(/sugar/i.test(item))return "പഞ്ചസാര";
 if(/koil|kerosene/i.test(item))return "മണ്ണെണ്ണ";
 if(/ragi/i.test(item))return (/powder/i.test(item) ? "റാഗി പൊടി" : "റാഗി");
 if(/kit/i.test(item))return "കിറ്റ്";
 return item;
}

/* Standard board rows (exact order as physical board) */
var ROWS = ["പച്ചരി", "മട്ട അരി", "പുഴുക്കലരി", "ഗോതമ്പ്", "ആട്ട", "മണ്ണെണ്ണ", "പഞ്ചസാര"];

/* ---- Parser: handles Tab-separated AND Space-separated AND comma-formatted numbers ---- */
function parseText(text){
 if(!text)return {header:null, entries:[]};
 var lines = text.split(/\r?\n/);
 var header = null;
 var entries = [];

 for(var i = 0; i < lines.length; i++){
  var line = lines[i].trim();
  if(!line) continue;

  /* Header */
  if(!header){
   var hm = line.match(/Stock Register for FPS (\d+)(?:\s*[-–]\s*([A-Za-z\s.]+))?\s*(?:\(District:\s*([^/]+)\/\s*TSO:\s*([^)]+)\))?\s*(?:for\s*(.+))?/i);
   if(hm){
    var rawDealer = hm[2] ? hm[2].trim() : "";
    if(/district|tso|month|year/i.test(rawDealer)) rawDealer = "";
    header = {
      ard: hm[1],
      dealer: rawDealer,
      dist: (hm[3] || "").trim(),
      tso: (hm[4] || "").trim(),
      period: (hm[5] || "").trim()
    };
    continue;
   }
  }

  /* Tab-separated */
  if(line.indexOf("\t") >= 0){
   var p = line.split("\t").map(function(s){return s.trim();}).filter(Boolean);
   if(p.length >= 5){
    var si = /^\d+$/.test(p[0]) ? 1 : 0;
    var sch = (p[si] || "").toUpperCase();
    var itm = p[si+1] || "";
    var un = p[si+2] || "";
    var lastN = null;
    for(var j = p.length - 1; j >= si + 3; j--){
     var v = parseFloat(p[j].replace(/,/g, ""));
     if(!isNaN(v)){lastN = v; break;}
    }
    if(lastN !== null && itm && un){
     entries.push({scheme:sch, item:itm, rawUnit:un, cb:lastN});
     continue;
    }
   }
  }

  /* Space-separated (with optional commas in numbers) */
  var cl = line.replace(/,/g, "");
  var sm = cl.match(/(?:^|\s)(AAY|NPI|NPNS|NPS|PHH|ALL|FREE|PL)\s+(.+?)\s+(Kgs|Ltrs|Pkts|FreeKit|Free Kit)\s+((?:-?\d+(?:\.\d+)?\s*)+)$/i);
  if(sm){
   var nums = sm[4].trim().split(/\s+/).map(Number).filter(function(n){return !isNaN(n);});
   entries.push({scheme:sm[1].toUpperCase(), item:sm[2].trim(), rawUnit:sm[3], cb:nums.length ? nums[nums.length-1] : 0});
  }
 }

 /* Fallback global header search */
 if(!header){
  var hg = text.replace(/\s+/g, " ").match(/Stock Register for FPS (\d+)(?:\s*[-–]\s*([A-Za-z\s.]+))?\s*(?:\(District:\s*([^/]+)\/\s*TSO:\s*([^)]+)\))?\s*(?:for\s*(.+?)(?:\s|$))?/i);
  if(hg){
    var rawD = hg[2] ? hg[2].trim() : "";
    if(/district|tso|month|year/i.test(rawD)) rawD = "";
    header = {
      ard: hg[1],
      dealer: rawD,
      dist: (hg[3] || "").trim(),
      tso: (hg[4] || "").trim(),
      period: (hg[5] || "").trim()
    };
  }
 }
 return {header:header, entries:entries};
}

/* Dealer names saved locally per ARD */
var DEALERS = {};
try{DEALERS = JSON.parse(localStorage.getItem("rsb_dealers") || "{}");}catch(e){}

function editDealerName(){
 var ardVal = document.getElementById("bArd").textContent.replace(/\D/g, "") || CFG.ard;
 if(!ardVal) return;
 var cur = DEALERS[ardVal] || document.getElementById("bDealer").textContent;
 if(cur === "—") cur = "";
 var neu = prompt("ലൈസൻസിയുടെ പേര് നൽകുക:", cur);
 if(neu !== null){
  DEALERS[ardVal] = neu.trim();
  try{localStorage.setItem("rsb_dealers", JSON.stringify(DEALERS));}catch(e){}
  document.getElementById("bDealer").textContent = neu.trim() || "—";
 }
}

/* ---- Render Board ---- */
function renderBoard(text, dealerFromApi){
 var res = parseText(text);
 var entries = res.entries;

 /* Aggregate by board row */
 var data = {};
 ROWS.forEach(function(r){data[r] = {aay:0, phh:0, nps:0, npns:0, all:0, has:false};});
 var extraRows = [];

 entries.forEach(function(e){
  var key = getRowKey(e.item);
  if(!data[key]){
   data[key] = {aay:0, phh:0, nps:0, npns:0, all:0, has:false};
   extraRows.push(key);
  }
  var d = data[key];
  d.has = true;
  if(e.scheme === "AAY") d.aay += e.cb;
  else if(e.scheme === "PHH") d.phh += e.cb;
  else if(e.scheme === "NPS") d.nps += e.cb;
  else if(e.scheme === "NPNS") d.npns += e.cb;
  else d.all += e.cb;
 });

 /* Date */
 var now = new Date();
 var pad = function(n){return n < 10 ? "0" + n : n;};
 document.getElementById("bDate").textContent =
  pad(now.getDate()) + "/" + pad(now.getMonth()+1) + "/" + now.getFullYear();

 /* Meta bar & Dealer info */
 var meta = document.getElementById("bMeta");
 var currentArd = (res.header && res.header.ard) || CFG.ard || "";

 if(currentArd){
  meta.style.display = "flex";
  document.getElementById("bArd").textContent = currentArd;

  // Resolve dealer name: custom saved > API fetched > parsed from text
  var dName = DEALERS[currentArd] || dealerFromApi || (res.header && res.header.dealer) || "";
  if(dName && /district|tso|month/i.test(dName)) dName = "";
  if(dealerFromApi && !DEALERS[currentArd] && !/district|tso|month/i.test(dealerFromApi)){
   DEALERS[currentArd] = dealerFromApi;
   try{localStorage.setItem("rsb_dealers", JSON.stringify(DEALERS));}catch(e){}
  }
  document.getElementById("bDealer").textContent = dName || "—";

  var tsoText = res.header ? (res.header.tso + (res.header.dist ? " (" + res.header.dist + ")" : "")) : "—";
  document.getElementById("bTso").textContent = tsoText;
  document.getElementById("bPeriod").textContent = (res.header && res.header.period) || "—";
  document.getElementById("bFoot").textContent = "ARD " + currentArd + (dName ? " · " + dName : "") + (res.header && res.header.period ? " · " + res.header.period : "");
 } else {
  meta.style.display = "none";
  document.getElementById("bFoot").textContent = "";
 }

 /* Build table */
 if(!entries.length){
  document.getElementById("bBody").innerHTML =
   '<tr><td colspan="5" style="padding:25px 8px;color:#888;font-weight:700">' +
   'ഡാറ്റ ലഭ്യമല്ല</td></tr>';
  return;
 }

 function fv(n){
  if(Math.abs(n) < 0.05) return "";
  return String(Math.round(n * 10) / 10);
 }

 var html = "";
 var allRows = ROWS.concat(extraRows);
 allRows.forEach(function(name){
  var d = data[name];
  if(!d) return;

  var isStandard = ROWS.indexOf(name) >= 0;
  var totalVal = Math.abs(d.aay) + Math.abs(d.phh) + Math.abs(d.nps) + Math.abs(d.npns) + Math.abs(d.all);

  // For non-standard extra rows, ONLY show if stock is non-zero
  if(!isStandard && totalVal < 0.05) return;

  // For standard rows, if completely unused/no data, can still show or skip
  if(!d.has && totalVal < 0.05) return;

  var aay = fv(d.aay);
  var phh = fv(d.phh);
  var nps = fv(d.nps);
  var npns = fv(d.npns);

  /* If only "ALL" scheme has value (e.g. Koil), show in npns column as in physical board */
  if(d.all > 0 && !d.aay && !d.phh && !d.nps && !d.npns){
   npns = fv(d.all);
  }

  html += '<tr>' +
   '<td class="c-item">' + name + '</td>' +
   '<td class="' + (aay ? "c-val" : "c-empty") + '">' + (aay || "") + '</td>' +
   '<td class="' + (phh ? "c-val" : "c-empty") + '">' + (phh || "") + '</td>' +
   '<td class="' + (nps ? "c-val" : "c-empty") + '">' + (nps || "") + '</td>' +
   '<td class="' + (npns ? "c-val" : "c-empty") + '">' + (npns || "") + '</td>' +
   '</tr>';
 });

 /* Special distribution row */
 html += '<tr class="row-special"><td colspan="5">സ്പെഷ്യൽ വിതരണം</td></tr>';

 document.getElementById("bBody").innerHTML = html;
}

/* ---- Search ---- */
var CFG = {ard:""};
try{var c = localStorage.getItem("rsb_cfg"); if(c) CFG = JSON.parse(c);}catch(e){}
document.getElementById("ard").value = CFG.ard || "";

function doSearch(){
 var ardVal = document.getElementById("ard").value.replace(/\D/g, "");
 var msg = document.getElementById("statusMsg");
 var btn = document.querySelector(".search-row button");

 if(ardVal.length !== 7){
  msg.className = "search-msg err";
  msg.textContent = "ശരിയായ 7 അക്ക ARD നമ്പർ നൽകുക";
  return;
 }

 CFG.ard = ardVal;
 try{localStorage.setItem("rsb_cfg", JSON.stringify(CFG));}catch(e){}

 var dist = ardVal.slice(0, 2);
 var tso = ardVal.slice(2, 4);
 var d = new Date();

 if(btn){btn.disabled = true; btn.textContent = "എടുക്കുന്നു...";}
 msg.className = "search-msg";
 msg.textContent = "ePOS പോർട്ടലിൽ നിന്ന് സ്റ്റോക്ക് എടുക്കുന്നു...";

 fetch("/api/stock?dist=" + dist + "&tso=" + tso + "&ard=" + ardVal + "&month=" + (d.getMonth() + 1) + "&year=" + d.getFullYear())
  .then(function(r){return r.json();})
  .then(function(j){
   if(j.error){
    msg.className = "search-msg err";
    msg.textContent = "പിശക്: " + j.error;
    return;
   }
   try{localStorage.setItem("rsb_text", j.text);}catch(e){}
   renderBoard(j.text, j.dealerName);
   msg.className = "search-msg ok";
   msg.textContent = "സ്റ്റോക്ക് വിജയകരമായി ലഭിച്ചു ✓";
  })
  .catch(function(){
   msg.className = "search-msg err";
   msg.textContent = "എടുക്കാൻ കഴിഞ്ഞില്ല. ഇന്റർനെറ്റ് പരിശോധിക്കുക.";
  })
  .finally(function(){
   if(btn){btn.disabled = false; btn.textContent = "സ്റ്റോക്ക് എടുക്കുക";}
  });
}

/* Load saved data on start */
try{
 var saved = localStorage.getItem("rsb_text");
 if(saved) renderBoard(saved);
}catch(e){}

/* Auto-fetch if ARD is saved */
if(CFG.ard && CFG.ard.length === 7 && location.protocol.indexOf("http") === 0){
 doSearch();
}
</script>
</body>
</html>
